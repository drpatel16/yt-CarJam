<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#141820" />
  <meta name="description" content="Car Jam — tap cars and clear the lot. Instant HTML5 puzzle." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Car Jam</title>
  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='10' width='64' height='64' fill='%23222a38'/%3E%3Crect x='8' y='26' width='30' height='16' rx='5' fill='%23ff5a5a'/%3E%3Crect x='36' y='18' width='16' height='28' rx='5' fill='%234d8dff'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <header id="hud" aria-live="polite">
      <div class="stat">Level <strong id="level">1</strong></div>
      <div class="stat">Cars <strong id="left">0</strong></div>
      <div class="stat">Moves <strong id="moves">0</strong></div>
    </header>

    <canvas id="game" width="400" height="640" aria-label="Car Jam puzzle"></canvas>

    <footer id="tools">
      <button id="undoBtn" type="button">Undo</button>
      <button id="hintBtn" type="button">Hint</button>
      <button id="restartBtn" type="button">Restart</button>
    </footer>

    <div id="overlay" class="show" role="dialog" aria-modal="true" aria-labelledby="title">
      <div class="panel">
        <p class="brand">Car Jam</p>
        <h1 id="title">Tap to play</h1>
        <p id="subtitle">Tap a car. If its lane is clear, it drives off.</p>
        <p id="stars" hidden></p>
        <button id="startBtn" type="button">Play</button>
      </div>
    </div>

    <div id="paused" class="banner" hidden>Paused</div>
  </div>

  <script src="https://www.youtube.com/game_api/v1"></script>
  <script src="game.js?v=2"></script>
</body>
</html>
